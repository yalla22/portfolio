<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Sample Cut/Fill heat-map placeholder — replace with a real screenshot" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder art: Cut/Fill diverging heat-map over a stylized survey map.
       SAMPLE ONLY — replace this file with a real product screenshot.
       Palette matches the portfolio's light-editorial theme; heat hues are
       literal (#d64545 cut / #3b6fd4 fill) to stay legible on both themes. -->
  <defs>
    <linearGradient id="legend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d64545" />
      <stop offset="0.42" stop-color="#d64545" stop-opacity="0" />
      <stop offset="0.58" stop-color="#3b6fd4" stop-opacity="0" />
      <stop offset="1" stop-color="#3b6fd4" />
    </linearGradient>
    <!-- organic blob drawn around the origin; reused at stepped scales -->
    <path id="blob-cut" d="M -104 -6 C -98 -52 -60 -76 -12 -74 C 38 -72 84 -50 96 -10 C 106 26 74 62 24 72 C -28 82 -78 66 -96 34 C -106 20 -108 8 -104 -6 Z" />
    <path id="blob-fill" d="M -96 4 C -100 -38 -66 -68 -18 -72 C 32 -76 86 -54 98 -14 C 108 22 82 58 34 70 C -16 82 -70 68 -90 38 C -98 26 -94 16 -96 4 Z" />
  </defs>

  <!-- base map -->
  <rect x="0" y="0" width="640" height="400" fill="#f2f1ec" />
  <g fill="#14181f">
    <rect x="0" y="0" width="80" height="80" opacity="0.028" />
    <rect x="160" y="0" width="80" height="80" opacity="0.045" />
    <rect x="320" y="80" width="80" height="80" opacity="0.03" />
    <rect x="80" y="160" width="80" height="80" opacity="0.04" />
    <rect x="480" y="0" width="80" height="80" opacity="0.035" />
    <rect x="560" y="240" width="80" height="80" opacity="0.045" />
    <rect x="240" y="320" width="80" height="80" opacity="0.03" />
    <rect x="0" y="240" width="80" height="80" opacity="0.045" />
    <rect x="400" y="320" width="80" height="80" opacity="0.04" />
  </g>
  <g stroke="#dcd8cc" stroke-width="1" opacity="0.9">
    <line x1="80" y1="0" x2="80" y2="400" /><line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" /><line x1="320" y1="0" x2="320" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" /><line x1="480" y1="0" x2="480" y2="400" />
    <line x1="560" y1="0" x2="560" y2="400" />
    <line x1="0" y1="80" x2="640" y2="80" /><line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="240" x2="640" y2="240" /><line x1="0" y1="320" x2="640" y2="320" />
  </g>
  <!-- sparse contour arcs -->
  <g fill="none" stroke="#cfcfc7" stroke-width="1.2" opacity="0.7">
    <path d="M -20 330 C 120 300 180 350 300 320 C 420 292 480 340 660 300" />
    <path d="M -20 66 C 140 96 260 40 400 70 C 500 92 560 56 660 76" />
  </g>

  <!-- CUT region: diverging red, 3 concentric steps (soft falloff) -->
  <g transform="translate(206 186)" fill="#d64545">
    <use href="#blob-cut" opacity="0.25" />
    <use href="#blob-cut" transform="scale(0.72)" opacity="0.45" />
    <use href="#blob-cut" transform="scale(0.46)" opacity="0.7" />
  </g>
  <!-- transparent dead-band = the untouched map gap between the two regions -->
  <!-- FILL region: diverging blue, 3 concentric steps -->
  <g transform="translate(452 238)" fill="#3b6fd4">
    <use href="#blob-fill" opacity="0.25" />
    <use href="#blob-fill" transform="scale(0.72)" opacity="0.45" />
    <use href="#blob-fill" transform="scale(0.46)" opacity="0.7" />
  </g>

  <!-- colour-stop legend bar with stop handles -->
  <g>
    <rect x="596" y="86" width="18" height="236" rx="3" fill="url(#legend)" stroke="#cfcfc7" stroke-width="1" />
    <rect x="591" y="160" width="28" height="9" rx="2" fill="#ffffff" stroke="#5b626e" stroke-width="1.2" />
    <rect x="591" y="240" width="28" height="9" rx="2" fill="#ffffff" stroke="#5b626e" stroke-width="1.2" />
  </g>

  <!-- corner mono readouts -->
  <g font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace" font-size="17" font-weight="600" letter-spacing="0.06em">
    <text x="22" y="34" fill="#d64545">CUT &#8722;2.1m</text>
    <text x="22" y="58" fill="#3b6fd4">FILL +1.8m</text>
  </g>

  <!-- SAMPLE watermark -->
  <g transform="rotate(-12 320 200)" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace" fill="#14181f" text-anchor="middle">
    <text x="320" y="210" font-size="56" letter-spacing="0.3em" opacity="0.14">SAMPLE</text>
    <text x="320" y="238" font-size="15" letter-spacing="0.12em" opacity="0.34">replace with real screenshot</text>
  </g>
</svg>
